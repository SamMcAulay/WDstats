services:
  bots:
    build: .
    image: wardogs-bots:latest
    container_name: wardogs-bots
    restart: unless-stopped
    # Secrets live only on the VPS. This file is never built into the image.
    env_file: .env
    networks:
      - warcon
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  warcon:
    external: true
    # Warcon's compose declares no network, so it gets the project default,
    # named after its directory: /home/debain/warcon -> warcon_default.
    # Confirm with `docker network ls` if the panel is ever moved or renamed.
    name: warcon_default
